<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Eagle Coin System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .contact-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(18, 26, 43, 0.95);
            border: 1px solid rgba(0, 255, 128, 0.3);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .contact-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-header h1 {
            color: #00ff80;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .contact-header p {
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #00ff80;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-card i {
            font-size: 1.5rem;
            color: #00ff80;
        }

        .info-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .info-card p {
            margin: 0;
            color: #cbd5e0;
            font-size: 0.95rem;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #00ff80;
            color: #0b0f19;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <div class="contact-header">
        <h1>Contact Us</h1>
        <p>Have questions or need support? Reach out to us!</p>
    </div>

    <div class="contact-info">
        <div class="info-card">
            <i class="fas fa-envelope"></i>
            <div>
                <h3>Email Support</h3>
                <p>support@eaglecoinsystem.com</p>
            </div>
        </div>

        <div class="info-card">
            <i class="fab fa-whatsapp"></i>
            <div>
                <h3>WhatsApp Support</h3>
                <p>+923430786398</p>
            </div>
        </div>

        <div class="info-card">
            <i class="fas fa-clock"></i>
            <div>
                <h3>Working Hours</h3>
                <p>24/7 Live System & Account Support</p>
            </div>
        </div>
    </div>

    <div style="text-align: center;">
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
</div>

</body>
</html>
