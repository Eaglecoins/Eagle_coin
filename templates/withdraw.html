<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Withdraw Money - Smart Coin</title>
    <!-- آئیکنز کے لیے FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #deff9a; margin-bottom: 5px; }
        .back-link { display: inline-block; color: #b2bec3; text-decoration: none; margin-bottom: 20px; font-weight: bold; transition: 0.3s; }
        .back-link:hover { color: #deff9a; }
        
        /* نوٹس باکس */
        .notice-card { background: #1e272e; padding: 15px; border-radius: 12px; border: 1px solid #341f97; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        .notice-card h3 { color: #deff9a; margin-top: 0; margin-bottom: 8px; font-size: 1.1rem; }
        .notice-card p { font-size: 0.9rem; color: #b2bec3; margin: 0; }

        /* فارم اسٹائلز (ڈپوزٹ پیج جیسا سیم اسٹائل) */
        form { background: #1a1a1a; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #b2bec3; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 6px; background: #2d3436; border: 1px solid #4b5563; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        input:focus, select:focus { border-color: #deff9a; outline: none; box-shadow: 0 0 5px rgba(222, 255, 154, 0.4); }
        
        /* ریڈ اونلی (لاکڈ) فیلڈز کا اسٹائل */
        input[readonly] { background: #222; border-color: #444; color: #b2bec3; cursor: not-allowed; }
        
        /* فائنل رقم کا خاص اسٹائل */
        #final_amount { color: #deff9a; font-weight: bold; font-size: 1.1rem; border-color: #341f97; }
        
        button { background-color: #deff9a; color: #000; padding: 14px; border: none; border-radius: 8px; width: 100%; margin-top: 25px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        button:hover { background-color: #c5e67a; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <a href="/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        
        <h1>Withdraw Money</h1>
        
        <div class="notice-card">
            <h3><i class="fas fa-info-circle"></i> Withdrawal Policy</h3>
            <p>Please Enter Your Correct Information</p>
        </div>
        
        <!-- فلیش میسجز کا ڈسپلے (اگر پائتھون سے کوئی میسج آئے) -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div style="color: #ff4d4d; font-weight: bold; margin-bottom: 15px; text-align: center; background: rgba(255,77,77,0.1); padding: 10px; border-radius: 6px;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- وڈڈرا فارم -->
        <form action="/withdraw" method="POST">
            
            <!-- Coins Input -->
            <label for="coins"><i class="fas fa-coins"></i> Enter Coins</label>
            <input type="number" id="coins" name="coins" required placeholder="Coins Input">

            <!-- Total Amount (PKR) -->
            <label for="total_amount"><i class="fas fa-money-bill-wave"></i> Total Amount (PKR):</label>
            <input type="text" id="total_amount" readonly placeholder="Auto Add Amount">

            <!-- Fee Deduction -->
            <label for="fee_amount"><i class="fas fa-percentage"></i> Fee (3% Deduction):</label>
            <input type="text" id="fee_amount" readonly placeholder="Deductin Fee">

            <!-- Final Amount to Receive -->
            <label for="final_amount"><i class="fas fa-wallet"></i> Final Amount to Receive:</label>
            <input type="text" id="final_amount" name="final_amount" readonly placeholder="Net Amount">

            <!-- Payment Method -->
            <label for="method"><i class="fas fa-university"></i> Payment Method</label>
            <select name="method" id="method" required>
                <option value="easypaisa">EasyPaisa</option>
                <option value="jazzcash">JazzCash</option>
                <option value="bank">Bank Account</option>
            </select>

            <!-- Account Number -->
            <label for="account_number"><i class="fas fa-user-circle"></i> Account Number</label>
            <input type="text" id="account_number" name="account_number" required placeholder="Your Account Number">

            <!-- IBAN Number -->
            <label for="iban"><i class="fas fa-fingerprint"></i> IBAN Number (Optional)</label>
            <input type="text" id="iban" name="iban" placeholder="IBAN Number">
            
            <button type="submit"><i class="fas fa-paper-plane"></i> Submit Withdrawal Request</button>
        </form>
    </div>

    <!-- لائیو ریٹ اور 2% فیس کیلکولیشن اسکرپٹ -->
    <script>
        function calculateWithdrawal() {
            const coinsInput = document.getElementById('coins');
            const totalAmountInput = document.getElementById('total_amount');
            const feeAmountInput = document.getElementById('fee_amount');
            const finalAmountInput = document.getElementById('final_amount');
            
            // پائتھون سے آنے والا لائیو ریٹ
            const rate = parseFloat("{{ rate }}"); 
            const feePercent = 3; // 2% کٹوتی

            if (coinsInput && totalAmountInput && feeAmountInput && finalAmountInput) {
                const coins = coinsInput.value;
                
                if (coins && coins > 0) {
                    const totalAmount = coins * rate;
                    const fee = (totalAmount * feePercent) / 100;
                    const finalAmount = totalAmount - fee;

                    totalAmountInput.value = totalAmount.toFixed(2);
                    feeAmountInput.value = fee.toFixed(2);
                    finalAmountInput.value = finalAmount.toFixed(2);
                } else {
                    totalAmountInput.value = "";
                    feeAmountInput.value = "";
                    finalAmountInput.value = "";
                }
            }
        }

        // جیسے ہی یوزر کوائنز والے خانے میں ٹائپ کرے گا، لائیو کیلکولیشن چلے گی
        document.getElementById('coins').addEventListener('input', calculateWithdrawal);
    </script>
</body>
</html>
