<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پاسورڈ ریکوری - Smart Coin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: right;
        }
        h2 {
            margin-top: 0;
            color: #e94560;
            text-align: center;
            margin-bottom: 10px;
        }
        p {
            font-size: 13px;
            color: #aaa;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0f3468;
            border: 1px solid #1f4068;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="file"] {
            padding: 7px;
            cursor: pointer;
        }
        input:focus {
            outline: none;
            border-color: #e94560;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #e94560;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #ff6b81;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #e94560;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>پاسورڈ ریکوری ریکوئسٹ</h2>
        <p>اپنے اکاؤنٹ کی تصدیق کے لیے درست معلومات درج کریں اور اپنی تصاویر اپ لوڈ کریں۔</p>
        
        <form method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>یوزر نیم (Username)</label>
                <input type="text" name="username" placeholder="اپنا یوزر نیم درج کریں" required>
            </div>
            
            <div class="form-group">
                <label>شناختی کارڈ نمبر (ID Card / CNIC)</label>
                <input type="text" name="id_card" placeholder="شناختی کارڈ نمبر درج کریں" required>
            </div>
            
            <div class="form-group">
                <label>موبائل نمبر (Registered Mobile No)</label>
                <input type="text" name="mobile" placeholder="رجسٹرڈ موبائل نمبر درج کریں" required>
            </div>
            
            <div class="form-group">
                <label>پروفাইল تصویر (Profile Picture)</label>
                <input type="file" name="profile_pic" accept="image/*" required>
            </div>
            
            <div class="form-group">
                <label>شناختی کارڈ کی تصویر (CNIC Picture)</label>
                <input type="file" name="cnic_pic" accept="image/*" required>
            </div>
            
            <button type="submit">ریکوئسٹ سبمٹ کریں</button>
        </form>
        
        <div class="back-link">
            <a href="/login">واپس لاگ ان پر جائیں</a>
        </div>
    </div>

</body>
</html>
